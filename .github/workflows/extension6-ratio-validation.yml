name: Extension 6 ratio validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/ExtensionPrimeCount.lean'
      - 'PrimeGPF/Extension6Asymptotic.lean'
      - 'PrimeGPF/Extension6Cutoff.lean'
      - 'PrimeGPF/Extension6Ratio.lean'
      - '.github/workflows/extension6-ratio-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension6-ratio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build extension 6 equation (10)
        run: lake build PrimeGPF.Extension6Ratio
