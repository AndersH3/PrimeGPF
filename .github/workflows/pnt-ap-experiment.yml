name: PNT-AP experiment

on:
  push:
    branches:
      - pnt-ap-formalization-20260913
  workflow_dispatch:

jobs:
  check-pnt-ap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: pnt-ap-v419-d3cea-${{ runner.os }}

      - name: Install elan / Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake env lean --version

      - name: Apply v4.19 compatibility patch to PNT dependency
        shell: bash
        run: |
          set -euo pipefail
          # At d3cea the PNT project still carried a local copy of
          # Nat.finMulAntidiagonal. PrimeGPF's pinned mathlib v4.19 already
          # contains the renamed Nat.finMulAntidiag API. Apply the substance of
          # the later upstream cleanup locally to this version-compatible
          # checkout, including the two theorem-name migrations used here.
          AUX=.lake/packages/PrimeNumberTheoremAnd/PrimeNumberTheoremAnd/Mathlib/NumberTheory/Sieve/AuxResults.lean
          SEL=.lake/packages/PrimeNumberTheoremAnd/PrimeNumberTheoremAnd/Mathlib/NumberTheory/Sieve/Selberg.lean
          sed -i \
            -e 's#import PrimeNumberTheoremAnd.Mathlib.Data.Nat.FinMulAntidiagonal#import Mathlib.Algebra.Order.Antidiag.Nat#' \
            -e 's/finMulAntidiagonal_univ_eq/finMulAntidiag_eq_piFinset_divisors_filter/g' \
            -e 's/card_finMulAntidiagonal/card_finMulAntidiag_of_squarefree/g' \
            "$AUX"
          sed -i \
            's#import Mathlib.NumberTheory.SelbergSieve#import Batteries.Tactic.Lemma#' \
            "$SEL"
          grep -n 'Antidiag.Nat\|finMulAntidiag_eq_piFinset_divisors_filter\|card_finMulAntidiag_of_squarefree' "$AUX"
          grep -n 'Batteries.Tactic.Lemma' "$SEL"

      - name: Fetch mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Build PrimeGPF including PNT-AP experiment
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build 2>&1 | tee pnt-ap-check.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnt-ap-check-log
          path: pnt-ap-check.log
          if-no-files-found: ignore
