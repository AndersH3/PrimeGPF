name: Compile extensions report PDF

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - EXTENSIONS_REPORT.tex
      - .github/workflows/compile-extensions-report.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xelatex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Compile report twice
        run: |
          xelatex -interaction=nonstopmode -halt-on-error EXTENSIONS_REPORT.tex
          xelatex -interaction=nonstopmode -halt-on-error EXTENSIONS_REPORT.tex

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXTENSIONS_REPORT.pdf
          if git diff --cached --quiet; then
            echo "EXTENSIONS_REPORT.pdf is already up to date."
          else
            git commit -m "Compile XeLaTeX extensions report"
            for attempt in 1 2 3; do
              git fetch origin extensions-5-6-8-9-10-20260915
              git rebase origin/extensions-5-6-8-9-10-20260915
              if git push origin HEAD:extensions-5-6-8-9-10-20260915; then
                exit 0
              fi
              echo "Push raced with another branch update; retrying ($attempt/3)."
              sleep 2
            done
            echo "Could not push compiled PDF after three retries."
            exit 1
          fi
