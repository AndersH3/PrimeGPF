name: Easy extension proof validation
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extensions.lean'
      - 'PrimeGPF/Extension1Core.lean'
      - 'PrimeGPF/Extension1Finite.lean'
      - 'PrimeGPF/Extension1Exponent.lean'
      - 'PrimeGPF/Extension2Core.lean'
      - 'PrimeGPF/Extension2Support.lean'
      - 'PrimeGPF/Extension2Primitive.lean'
      - 'PrimeGPF/Extension2NonprimitiveCount.lean'
      - 'PrimeGPF/Extension7Core.lean'
      - 'PrimeGPF/Extension7Finite.lean'
      - 'PrimeGPF/Extension7Density.lean'
      - 'PrimeGPF/Extension17Support.lean'
      - 'PrimeGPF/ExtensionPrimeCount.lean'
      - '.github/workflows/easy-extension-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-easy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build extension dependencies
        run: lake build PrimeGPF.Extensions
      - name: Build extension 1 core
        run: lake build PrimeGPF.Extension1Core
      - name: Build restricted support lemmas
        if: always()
        run: lake build PrimeGPF.Extension17Support
      - name: Build extension 1 finite bound
        if: always()
        run: lake build PrimeGPF.Extension1Finite
      - name: Build extension 1 support dimension
        if: always()
        run: lake build PrimeGPF.Extension1Exponent
      - name: Build extension 2 core
        if: always()
        run: lake build PrimeGPF.Extension2Core
      - name: Build extension 2 support
        if: always()
        run: lake build PrimeGPF.Extension2Support
      - name: Build extension 2 primitive families
        if: always()
        run: lake build PrimeGPF.Extension2Primitive
      - name: Build extension 2 nonprimitive count
        if: always()
        run: lake build PrimeGPF.Extension2NonprimitiveCount
      - name: Build extension 7 core
        if: always()
        run: lake build PrimeGPF.Extension7Core
      - name: Build extension 7 finite bound
        if: always()
        run: lake build PrimeGPF.Extension7Finite
      - name: Build extension 7 density zero
        if: always()
        run: lake build PrimeGPF.Extension7Density
      - name: Build prime-count normalization
        if: always()
        run: lake build PrimeGPF.ExtensionPrimeCount
