name: Easy extension proof validation
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extensions.lean'
      - 'PrimeGPF/Extension1Core.lean'
      - 'PrimeGPF/Extension2Core.lean'
      - 'PrimeGPF/Extension2Support.lean'
      - 'PrimeGPF/Extension34Residues.lean'
      - 'PrimeGPF/Extension34Structure.lean'
      - 'PrimeGPF/Extension34Converse.lean'
      - 'PrimeGPF/Extension3Coprime.lean'
      - 'PrimeGPF/Extension4Odd.lean'
      - 'PrimeGPF/Extension4Coprime.lean'
      - 'PrimeGPF/Extension34Exact.lean'
      - 'PrimeGPF/Extension7Core.lean'
      - 'PrimeGPF/Extension17Support.lean'
      - 'PrimeGPF/ExtensionPrimeCount.lean'
      - 'PrimeGPF/Extension8Corollary.lean'
      - 'PrimeGPF/Extension10Dynamics.lean'
      - 'PrimeGPF/Extension9Revised.lean'
      - '.github/workflows/easy-extension-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-easy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: prime-gpf-lean419-extensions-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build extension dependencies
        run: lake build PrimeGPF.Extensions
      - name: Build extension 1 core
        run: lake build PrimeGPF.Extension1Core
      - name: Build extension 2 core
        if: always()
        run: lake build PrimeGPF.Extension2Core
      - name: Compile extension 2 support
        if: always()
        run: lake env lean PrimeGPF/Extension2Support.lean
      - name: Build revised extension 9 helpers
        if: always()
        run: lake build PrimeGPF.Extension9Revised
      - name: Build extension 3 and 4 residues
        if: always()
        run: lake build PrimeGPF.Extension34Residues
      - name: Build extension 3 and 4 structure
        if: always()
        run: lake build PrimeGPF.Extension34Structure
      - name: Build extension 3 and 4 converse
        if: always()
        run: lake build PrimeGPF.Extension34Converse
      - name: Build extension 3 coprimality
        if: always()
        run: lake build PrimeGPF.Extension3Coprime
      - name: Build extension 4 odd exponents
        if: always()
        run: lake build PrimeGPF.Extension4Odd
      - name: Build extension 4 coprimality
        if: always()
        run: lake build PrimeGPF.Extension4Coprime
      - name: Compile exact extension 3 and 4 classifications
        if: always()
        run: lake env lean PrimeGPF/Extension34Exact.lean
      - name: Build extension 7 core
        if: always()
        run: lake build PrimeGPF.Extension7Core
      - name: Compile restricted support lemmas
        if: always()
        run: lake env lean PrimeGPF/Extension17Support.lean
      - name: Build prime-count normalization
        if: always()
        run: lake build PrimeGPF.ExtensionPrimeCount
      - name: Compile extension 8 corollary
        if: always()
        run: lake env lean PrimeGPF/Extension8Corollary.lean
      - name: Compile extension 10 dynamics
        if: always()
        run: lake env lean PrimeGPF/Extension10Dynamics.lean
