name: Easy extension proof validation
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extensions.lean'
      - 'PrimeGPF/Extension8Corollary.lean'
      - 'PrimeGPF/Extension10Dynamics.lean'
      - '.github/workflows/easy-extension-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-easy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: prime-gpf-lean419-extensions-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build extension dependencies
        run: lake build PrimeGPF.Extensions
      - name: Compile extension 8 corollary
        run: lake env lean PrimeGPF/Extension8Corollary.lean
      - name: Compile extension 10 dynamics
        if: always()
        run: lake env lean PrimeGPF/Extension10Dynamics.lean
