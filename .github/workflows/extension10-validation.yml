name: Extension 10 dynamics validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extension10Dynamics.lean'
      - '.github/workflows/extension10-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build Extension 10 dynamics
        run: lake build PrimeGPF.Extension10Dynamics
