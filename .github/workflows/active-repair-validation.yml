name: Active extension repair validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extension2Primitive.lean'
      - 'PrimeGPF/Extension2NonprimitiveCount.lean'
      - 'PrimeGPF/Extension2RestrictedCounting.lean'
      - 'PrimeGPF/Extension2Dimension.lean'
      - 'PrimeGPF/Extension34Structure.lean'
      - 'PrimeGPF/Extension34Exact.lean'
      - 'PrimeGPF/Extension34Counting.lean'
      - 'PrimeGPF/Extension34WeightedPairs.lean'
      - 'PrimeGPF/Extension34CandidatePairs.lean'
      - 'PrimeGPF/Extension34CandidateCount.lean'
      - 'PrimeGPF/WeightedTriangleRows.lean'
      - 'PrimeGPF/WeightedTriangleArea.lean'
      - 'PrimeGPF/Extension34AreaBound.lean'
      - 'PrimeGPF/Extension34ParityReduction.lean'
      - 'PrimeGPF/Extension34ParityAreaBound.lean'
      - '.github/workflows/active-repair-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: active-extension-repair-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build extension dependencies
        run: lake build PrimeGPF.Extensions
      - name: Build extension 2 support
        run: lake build PrimeGPF.Extension2Support
      - name: Build extension 2 primitive families
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension2Primitive
      - name: Build extension 2 nonprimitive count
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension2NonprimitiveCount
      - name: Build extension 2 restricted counting
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension2RestrictedCounting
      - name: Build extension 2 support dimension
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension2Dimension
      - name: Build extensions 3 and 4 exact classifications
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34Exact
      - name: Build extensions 3 and 4 counting corollaries
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34Counting
      - name: Build extensions 3 and 4 weighted-pair reduction
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34WeightedPairs
      - name: Build extensions 3 and 4 finite candidate pairs
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34CandidatePairs
      - name: Build extensions 3 and 4 candidate count reduction
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34CandidateCount
      - name: Build weighted triangle row decomposition
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.WeightedTriangleRows
      - name: Build weighted triangle area estimate
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.WeightedTriangleArea
      - name: Build extensions 3 and 4 sharp-area bounds
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34AreaBound
      - name: Build extensions 3 and 4 parity-scaled reductions
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34ParityReduction
      - name: Build extensions 3 and 4 parity-improved area bounds
        if: ${{ !cancelled() }}
        run: lake build PrimeGPF.Extension34ParityAreaBound
