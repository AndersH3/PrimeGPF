name: Secondary extension proof validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extensions.lean'
      - 'PrimeGPF/Extension8Corollary.lean'
      - 'PrimeGPF/Extension10Dynamics.lean'
      - '.github/workflows/secondary-extension-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secondary-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build extension dependencies
        run: lake build PrimeGPF.Extensions
      - name: Compile extension 8 prime-polynomial corollary
        run: lake env lean PrimeGPF/Extension8Corollary.lean
      - name: Compile extension 10 dynamical separation
        if: always()
        run: lake env lean PrimeGPF/Extension10Dynamics.lean
