name: Analytic helper validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/WeightedCounting.lean'
      - 'PrimeGPF/WeightedTriangle.lean'
      - 'PrimeGPF/WeightedTriangleRows.lean'
      - 'PrimeGPF/WeightedTriangleArea.lean'
      - 'PrimeGPF/Extension34Residues.lean'
      - 'PrimeGPF/Extension34ResidueHelpers.lean'
      - 'PrimeGPF/Extension34Structure.lean'
      - 'PrimeGPF/Extension4Odd.lean'
      - 'PrimeGPF/Extension34PrimitiveHelpers.lean'
      - 'PrimeGPF/Extension3Coprime.lean'
      - 'PrimeGPF/Extension4Coprime.lean'
      - 'PrimeGPF/Extension34Converse.lean'
      - 'PrimeGPF/Extension34Exact.lean'
      - 'PrimeGPF/Extension34WeightedPairs.lean'
      - 'PrimeGPF/Extension34CandidatePairs.lean'
      - 'PrimeGPF/Extension34CandidateCounting.lean'
      - 'PrimeGPF/Extension34FiberCounting.lean'
      - 'PrimeGPF/Extension34ParityCounting.lean'
      - 'PrimeGPF/Extension34MobiusSetup.lean'
      - 'PrimeGPF/Extension34MobiusFinite.lean'
      - 'PrimeGPF/Extension7Limit.lean'
      - '.github/workflows/analytic-helper-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytic-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build weighted counting helpers
        run: lake build PrimeGPF.WeightedCounting
      - name: Build weighted triangle helpers
        if: always()
        run: lake build PrimeGPF.WeightedTriangle
      - name: Build weighted triangle row bound
        if: always()
        run: lake build PrimeGPF.WeightedTriangleRows
      - name: Build weighted triangle area bound
        if: always()
        run: lake build PrimeGPF.WeightedTriangleArea
      - name: Build Extension 3/4 support structure
        if: always()
        run: lake build PrimeGPF.Extension34Structure
      - name: Build Extension 4 odd-exponent reduction
        if: always()
        run: lake build PrimeGPF.Extension4Odd
      - name: Build Extension 3/4 primitive helper
        if: always()
        run: lake build PrimeGPF.Extension34PrimitiveHelpers
      - name: Build Extension 3 coprimality
        if: always()
        run: lake build PrimeGPF.Extension3Coprime
      - name: Build Extension 4 coprimality
        if: always()
        run: lake build PrimeGPF.Extension4Coprime
      - name: Build Extension 3/4 converse
        if: always()
        run: lake build PrimeGPF.Extension34Converse
      - name: Build Extension 3/4 residue helpers
        if: always()
        run: lake build PrimeGPF.Extension34ResidueHelpers
      - name: Build Extension 3/4 exact classifications
        if: always()
        run: lake build PrimeGPF.Extension34Exact
      - name: Build Extension 3/4 weighted-pair reduction
        if: always()
        run: lake build PrimeGPF.Extension34WeightedPairs
      - name: Build Extension 3/4 candidate-pair reduction
        if: always()
        run: lake build PrimeGPF.Extension34CandidatePairs
      - name: Build Extension 3/4 candidate counting
        if: always()
        run: lake build PrimeGPF.Extension34CandidateCounting
      - name: Build Extension 3/4 fiber counting bridge
        if: always()
        run: lake build PrimeGPF.Extension34FiberCounting
      - name: Build Extension 3/4 parity counting
        if: always()
        run: lake build PrimeGPF.Extension34ParityCounting
      - name: Build Extension 3/4 Möbius setup
        if: always()
        run: lake build PrimeGPF.Extension34MobiusSetup
      - name: Build Extension 3/4 finite Möbius detector
        if: always()
        run: lake build PrimeGPF.Extension34MobiusFinite
      - name: Build extension 7 limit theorem
        if: always()
        run: lake build PrimeGPF.Extension7Limit
