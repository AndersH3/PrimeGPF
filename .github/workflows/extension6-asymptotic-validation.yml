name: Extension 6 asymptotic validation
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/ExtensionPrimeCount.lean'
      - 'PrimeGPF/Extension6PNT.lean'
      - 'PrimeGPF/Extension6Asymptotic.lean'
      - 'PrimeGPF/Extension6Cutoff.lean'
      - 'PrimeGPF/Extension6Ratio.lean'
      - '.github/workflows/extension6-asymptotic-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension6-asymptotic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build prime-count normalization
        run: lake build PrimeGPF.ExtensionPrimeCount
      - name: Build extension 6 PNT normalization
        if: always()
        run: lake build PrimeGPF.Extension6PNT
      - name: Build fixed-scale PNT ratio
        if: always()
        run: lake build PrimeGPF.Extension6Asymptotic
      - name: Build extension 6 cutoff arithmetic
        if: always()
        run: lake build PrimeGPF.Extension6Cutoff
      - name: Build extension 6 image-ratio theorem
        if: always()
        run: lake build PrimeGPF.Extension6Ratio
