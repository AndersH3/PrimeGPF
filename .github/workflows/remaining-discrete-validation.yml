name: Remaining discrete extension validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extension8Corollary.lean'
      - 'PrimeGPF/Extension9.lean'
      - 'PrimeGPF/Extension10Dynamics.lean'
      - '.github/workflows/remaining-discrete-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remaining-discrete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discrete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build shared extension module
        run: lake build PrimeGPF.Extensions
      - name: Compile extension 8 prime-polynomial corollary
        if: always()
        run: lake env lean PrimeGPF/Extension8Corollary.lean
      - name: Compile extension 9 triple-collision classification
        if: always()
        run: lake env lean PrimeGPF/Extension9.lean
      - name: Compile extension 10 dynamics
        if: always()
        run: lake env lean PrimeGPF/Extension10Dynamics.lean
