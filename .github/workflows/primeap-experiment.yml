name: PrimeAP experiment

on:
  push:
    branches:
      - prove-prime-ap-input-20260913
    paths:
      - 'PrimeAPExperiment.lean'
      - 'PrimeAPThetaExperiment.lean'
      - 'PrimeAPUnweightExperiment.lean'
      - 'PrimeGPF/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/primeap-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain $(cat lean-toolchain)
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Build PrimeGPF
        run: lake build

      - name: Compile PrimeAP experiment module
        run: lake env lean -o .lake/build/lib/lean/PrimeAPExperiment.olean PrimeAPExperiment.lean

      - name: Check theta/Kronecker experiment
        run: lake env lean PrimeAPThetaExperiment.lean

      - name: Check AP unweighting experiment
        run: lake env lean PrimeAPUnweightExperiment.lean
