name: Extension 7 dimension-one validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extension7DimensionOne.lean'
      - 'PrimeGPF/LogAsymptotics.lean'
      - 'PrimeGPF/Extension1DimensionOne.lean'
      - '.github/workflows/extension7-dimension-one-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension7-dim1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dim1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build sharp dimension-one extension 7 bound
        run: lake build PrimeGPF.Extension7DimensionOne
