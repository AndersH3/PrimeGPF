name: Build PrimeGPF report

on:
  push:
    branches:
      - report-upload-20260913
    paths:
      - 'report/.bootstrap/**'
      - '.github/workflows/build-primegpf-report.yml'

permissions:
  contents: write

jobs:
  build-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Reconstruct report sources
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 6500 report/.bootstrap/source.part00
            cat report/.bootstrap/source.part01
            cat report/.bootstrap/source.part02
            cat report/.bootstrap/source.part03
            cat report/.bootstrap/source.part04
          } | base64 -d > /tmp/prime_gpf_report_source.tar.xz
          echo '5bc0f0e88a9c2c83f8e9a4df7ded5429f3b6bf8e39e61beaca2bd55dc1cb92a4  /tmp/prime_gpf_report_source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/prime_gpf_report_source.tar.xz -C report

      - name: Compile XeLaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: prime_gpf_report.tex
          working_directory: report
          latexmk_use_xelatex: true
          texlive_version: 2025

      - name: Package report project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path('report')
          files = [
              'CHANGELOG.md',
              'QUALITY_CONTROL.md',
              'README_BUILD.md',
              'build.sh',
              'diagrams.tex',
              'prime_gpf_report.tex',
              'prime_gpf_sources.bib',
              'prime_gpf_report.pdf',
          ]
          out = root / 'prime_gpf_report_xelatex.zip'
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for name in files:
                  z.write(root / name, arcname=f'prime_gpf_report_xelatex/{name}')
          PY

      - name: Commit finished report to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf report/.bootstrap
          rm -f report/*.aux report/*.bbl report/*.bcf report/*.blg report/*.log report/*.out report/*.run.xml report/*.toc report/*.lof report/*.lot report/*.fls report/*.fdb_latexmk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A report
          git commit -m 'Add updated PrimeGPF report and XeLaTeX project'
          git push origin HEAD:report-upload-20260913

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-gpf-report
          path: report/prime_gpf_report.pdf
