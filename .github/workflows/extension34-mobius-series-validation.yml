name: Extension34 Möbius-series validation

# Keep this workflow focused on the finite detector and the analytic odd-part
# identity.  In particular it validates compatibility with the repository's
# pinned Mathlib 4.19 arithmetic-function API before these modules are added to
# the umbrella `PrimeGPF` target.
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extension34*.lean'
      - 'PrimeGPF/Extension3Coprime.lean'
      - 'PrimeGPF/Extension4Coprime.lean'
      - 'PrimeGPF/Extension4Odd.lean'
      - 'PrimeGPF/WeightedTriangle*.lean'
      - '.github/workflows/extension34-mobius-series-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension34-mobius-series-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobius-series:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build finite Möbius detector
        run: lake build PrimeGPF.Extension34MobiusFinite
      - name: Build odd Möbius L-series identity
        run: lake build PrimeGPF.Extension34MobiusSeries
