name: Weighted triangle lower-bound validation

# This focused workflow guards the two-sided lattice/area estimate used by the
# later signed Möbius summation.  Keep it separate from the broader analytic
# workflow so regressions in the floor-sum algebra are easy to isolate.
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/WeightedTriangleLower.lean'
      - '.github/workflows/weighted-triangle-lower-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weighted-triangle-lower-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lower-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build two-sided weighted triangle bound
        run: lake build PrimeGPF.WeightedTriangleLower
