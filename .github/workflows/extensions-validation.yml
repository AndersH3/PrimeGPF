name: Extension proof validation
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: cache
        with:
          path: .lake
          key: prime-gpf-lean419-extensions-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build baseline local modules
        run: lake build
      - name: Build extension module
        run: lake build PrimeGPF.Extensions
      - name: Compile extension 8 corollary
        run: lake env lean PrimeGPF/Extension8Corollary.lean
      - name: Compile extension 10 dynamics
        run: lake env lean PrimeGPF/Extension10Dynamics.lean
      - name: Compile triple-collision extension
        run: lake env lean PrimeGPF/Extension9.lean
      - name: Verify baseline project
        if: always()
        run: bash verify.sh
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: .lake
          key: prime-gpf-lean419-extensions-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
