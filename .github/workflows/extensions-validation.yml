name: Extension proof validation
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF.lean'
      - 'PrimeGPF/Extensions.lean'
      - 'PrimeGPF/Extension8Corollary.lean'
      - 'PrimeGPF/Extension10Dynamics.lean'
      - 'PrimeGPF/Extension9.lean'
      - 'PrimeGPF/Extension9Revised.lean'
      - 'PrimeGPF/Core.lean'
      - 'PrimeGPF/Statements.lean'
      - 'PrimeGPF/Elementary.lean'
      - 'PrimeGPF/Arithmetic.lean'
      - 'PrimeGPF/Orders.lean'
      - 'PrimeGPF/DirectExponential.lean'
      - 'PrimeGPF/Conditional.lean'
      - 'PrimeGPF/PrimeExponent.lean'
      - 'PrimeGPF/Dynamics.lean'
      - 'PrimeGPF/Density.lean'
      - 'PrimeGPF/Complete.lean'
      - 'verify.sh'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/extensions-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build baseline local modules
        run: lake build
      - name: Build extension module
        run: lake build PrimeGPF.Extensions
      - name: Compile extension 8 corollary
        run: lake env lean PrimeGPF/Extension8Corollary.lean
      - name: Compile extension 10 dynamics
        run: lake env lean PrimeGPF/Extension10Dynamics.lean
      - name: Compile canonical triple-collision extension
        run: lake env lean PrimeGPF/Extension9.lean
      - name: Verify baseline project
        if: ${{ !cancelled() }}
        run: bash verify.sh
