name: Log asymptotics validation

on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/LogAsymptotics.lean'
      - '.github/workflows/log-asymptotics-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-asymptotics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  log-asymptotics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build logarithmic asymptotics
        run: lake build PrimeGPF.LogAsymptotics
