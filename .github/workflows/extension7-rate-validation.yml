name: Extension 7 rate validation
on:
  push:
    branches: [extensions-5-6-8-9-10-20260915]
    paths:
      - 'PrimeGPF/Extension7Rate.lean'
      - '.github/workflows/extension7-rate-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension7-rate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build extension 7 equation (13)
        run: lake build PrimeGPF.Extension7Rate
